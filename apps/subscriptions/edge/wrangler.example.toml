# [INPUT]: 认证限流、私有Tunnel及固定VPC编号。
# [OUTPUT]: 仅供LifeOS调用的内部Worker。
# [POS]: 不创建公网域名；VPC只指向VPS回环18787。
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
name = "lifeos-subscriptions"
main = "index.ts"
compatibility_date = "2026-10-26"
workers_dev = false
preview_urls = false

[[vpc_services]]
binding = "SUBOS_ORIGIN"
service_id = "REPLACE_WITH_VPC_SERVICE_ID"

[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1001"
simple = { limit = 6, period = 60 }
